# Installed by deploy/remote-deploy.sh only when the site does not exist yet;
# certbot then adds the HTTPS listener and HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Matches serverActions.bodySizeLimit in next.config.ts
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # WebSocket upgrade (chat, notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
